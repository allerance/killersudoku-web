name: Enable Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable branch Pages without Enforce HTTPS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f source[branch]=main -f source[path]=/ -f build_type=legacy
          echo POST:$?
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f cname='killersudoku.arcadewick.com' -F https_enforced=false
          echo PUT:$?
          gh api "repos/${GITHUB_REPOSITORY}/pages" || true
